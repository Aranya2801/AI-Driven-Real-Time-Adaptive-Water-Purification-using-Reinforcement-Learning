[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "aquapurify-rl"
version     = "1.0.0"
description = "AI-Driven Real-Time Adaptive Water Purification Using Reinforcement Learning"
readme      = "README.md"
license     = { file = "LICENSE" }
requires-python = ">=3.10"
keywords    = [
    "reinforcement-learning", "water-purification", "deep-learning",
    "digital-twin", "iot", "explainable-ai", "anomaly-detection",
    "time-series-forecasting", "multi-agent-rl", "sustainability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage      = "https://github.com/yourusername/aquapurify-rl"
Documentation = "https://aquapurify-rl.readthedocs.io"
Repository    = "https://github.com/yourusername/aquapurify-rl"
"Bug Tracker" = "https://github.com/yourusername/aquapurify-rl/issues"
Paper         = "https://arxiv.org/abs/2024.XXXXX"

[project.scripts]
aquapurify-train     = "src.deep_rl.trainer:main"
aquapurify-dashboard = "src.dashboard.app:main"
aquapurify-api       = "src.api.server:main"
aquapurify-simulate  = "src.digital_twin.plant_twin:main"

[tool.ruff]
line-length    = 100
target-version = "py310"
select         = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "PT"]
ignore         = ["E501", "B008", "A003"]
exclude        = ["notebooks/", "docs/", "*.ipynb"]

[tool.ruff.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.black]
line-length    = 100
target-version = ["py310", "py311"]
include        = '\\.pyi?$'

[tool.isort]
profile    = "black"
line_length = 100

[tool.mypy]
python_version         = "3.11"
warn_return_any        = true
warn_unused_configs    = true
ignore_missing_imports = true
no_strict_optional     = true

[tool.pytest.ini_options]
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]
addopts          = "-v --tb=short --strict-markers"
markers          = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "gpu:  marks tests requiring GPU",
    "iot:  marks tests requiring IoT hardware",
]

[tool.coverage.run]
source   = ["src"]
omit     = ["*/tests/*", "*/notebooks/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.setuptools.packages.find]
where   = ["."]
include = ["src*", "datasets*"]
